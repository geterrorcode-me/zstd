name: vMeer Zstd Android Build

on:
  workflow_dispatch: # Membolehkan anda menjalankan build secara manual

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Kita fokus pada arm64-v8a untuk prestasi Dimensity 8300 Ultra
        abi: [arm64-v8a]
        api_level: [24] # Minimum API 24 (Android 7.0+)

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nndk/setup-ndk@v0
        with:
          ndk-version: r26b # Versi stabil yang serasi dengan r26d anda
          add-to-path: true

      - name: Build Static Library (.a)
        run: |
          mkdir build-android
          cd build-android
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=${{ matrix.abi }} \
                -DANDROID_PLATFORM=android-${{ matrix.api_level }} \
                -DZSTD_BUILD_STATIC=ON \
                -DZSTD_BUILD_SHARED=OFF \
                -DZSTD_BUILD_PROGRAMS=OFF \
                -DZSTD_BUILD_CONTRIB=OFF \
                -DZSTD_BUILD_TESTS=OFF \
                -DZSTD_LEGACY_SUPPORT=OFF \
                -DCMAKE_BUILD_TYPE=Release \
                ../build/cmake
          make -j$(nproc)

      - name: Prepare Output Folder
        run: |
          mkdir -p vmeer-dist/libs/${{ matrix.abi }}
          mkdir -p vmeer-dist/include
          cp build-android/lib/libzstd.a vmeer-dist/libs/${{ matrix.abi }}/
          cp lib/zstd.h vmeer-dist/include/
          cp lib/zdict.h vmeer-dist/include/
          cp lib/zerrors.h vmeer-dist/include/

      - name: Upload vMeer Zstd Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libzstd-android-${{ matrix.abi }}
          path: vmeer-dist/
          
