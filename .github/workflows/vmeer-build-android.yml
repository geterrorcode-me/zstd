name: vMeer Zstd Android Build

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build with Pre-installed NDK
        run: |
          # 1. Mencari lokasi NDK terbaru di Runner
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* | tail -1)
          TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake"
          
          echo "Using NDK found at: $NDK_PATH"
          
          # 2. Persiapkan Folder Build
          mkdir -p build-android
          cd build-android
          
          # 3. Jalankan CMake dalam satu baris untuk menghindari error dash/backslash
          cmake -G"Unix Makefiles" -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DZSTD_BUILD_STATIC=ON -DZSTD_BUILD_SHARED=OFF -DZSTD_BUILD_PROGRAMS=OFF -DZSTD_BUILD_CONTRIB=OFF -DZSTD_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release ../build/cmake

          # 4. Compile menggunakan semua core CPU yang tersedia
          make -j$(nproc)

      - name: Prepare Output Folder
        run: |
          # Buat struktur folder distribusi
          mkdir -p vmeer-dist/libs/arm64-v8a
          mkdir -p vmeer-dist/include
          
          # Salin Library Statis (.a)
          cp build-android/lib/libzstd.a vmeer-dist/libs/arm64-v8a/
          
          # Gunakan 'find' untuk mengambil header utama secara aman
          echo "Collecting headers..."
          find lib -maxdepth 2 -name "zstd.h" -exec cp {} vmeer-dist/include/ \;
          find lib -name "zdict.h" -exec cp {} vmeer-dist/include/ \;
          find lib -name "zstd_errors.h" -exec cp {} vmeer-dist/include/ \;
          
          # Salin header tambahan dari common jika ada
          find lib/common -name "zstd_*.h" -exec cp {} vmeer-dist/include/ \; 2>/dev/null || true

          echo "Include folder content:"
          ls vmeer-dist/include/

      - name: Upload vMeer Zstd Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libzstd-vmeer-arm64
          path: vmeer-dist/
          
