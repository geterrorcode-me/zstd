name: vMeer Zstd Android Build

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        
      - name: Build with Pre-installed NDK
        run: |
          # 1. Cari lokasi NDK secara dinamis
          # GitHub runner biasanya menyimpan beberapa versi di $ANDROID_SDK_ROOT/ndk/
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* | tail -1)
          TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake"
          
          echo "Using NDK found at: $NDK_PATH"
          echo "Toolchain file: $TOOLCHAIN_FILE"

          if [ ! -f "$TOOLCHAIN_FILE" ]; then
            echo "❌ Error: Toolchain file tidak ditemukan di $TOOLCHAIN_FILE"
            exit 1
          fi
          
          # 2. Persiapkan Folder Build
          mkdir build-android
          cd build-android
          
          # 3. Konfigurasi CMake dengan Ninja (lebih stabil di CI)
          # Gunakan -G"Unix Makefiles" jika ingin tetap pakai make
          cmake -G"Unix Makefiles" \
                -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE" \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-24 \
                -DZSTD_BUILD_STATIC=ON \
                -DZSTD_BUILD_SHARED=OFF \
                -DZSTD_BUILD_PROGRAMS=OFF \
                -DZSTD_BUILD_CONTRIB=OFF \
                -DZSTD_BUILD_TESTS=OFF \
                -DCMAKE_BUILD_TYPE=Release \
                ../build/cmake
          
          # 4. Compile
          make -j$(nproc)

          
          # 4. Compile
          make -j$(nproc)

      - name: Prepare Output Folder
        run: |
          mkdir -p vmeer-dist/libs/arm64-v8a
          mkdir -p vmeer-dist/include
          # Sesuaikan lokasi file hasil build zstd
          cp build-android/lib/libzstd.a vmeer-dist/libs/arm64-v8a/
          cp lib/zstd.h vmeer-dist/include/
          cp lib/zdict.h vmeer-dist/include/
          cp lib/zerrors.h vmeer-dist/include/

      - name: Upload vMeer Zstd Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libzstd-vmeer-arm64
          path: vmeer-dist/
